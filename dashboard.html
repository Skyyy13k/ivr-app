<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Appels</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a0f; color: #e8eaf0;
    padding: 1.5rem; max-width: 1000px; margin: 0 auto;
    min-height: 100vh;
}
h1 { margin-bottom: 1rem; color: #e94560; font-size: 1.5rem; }
.status {
    background: #15151d; border: 1px solid #2a2a3a;
    border-radius: 10px; padding: 1rem; margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 0.6rem;
    font-size: 0.9rem;
}
.dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #888; transition: all 0.3s;
}
.dot.on {
    background: #10b981;
    box-shadow: 0 0 12px #10b981;
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
.calls { display: grid; gap: 1rem; }
.call-card {
    background: #15151d; border: 1px solid #2a2a3a;
    border-radius: 12px; padding: 1.5rem;
    animation: slideIn 0.35s;
}
@keyframes slideIn {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
}
.call-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 1rem;
    padding-bottom: 1rem; border-bottom: 1px solid #2a2a3a;
}
.call-from {
    font-size: 1.05rem; font-weight: 700;
    color: #f5a623; display: flex;
    align-items: center; gap: 0.5rem;
}
.call-time { font-size: 0.8rem; color: #888; margin-top: 0.2rem; }
.digits-display {
    display: flex; gap: 0.7rem; margin-bottom: 1rem;
    flex-wrap: wrap; min-height: 90px;
    align-items: center;
}
.digit-box {
    width: 65px; height: 85px;
    background: #000; border: 2px solid #10b981;
    border-radius: 10px; display: flex;
    align-items: center; justify-content: center;
    font-size: 2.8rem; font-weight: 800;
    font-family: monospace; color: #10b981;
    animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 20px rgba(16,185,129,0.3);
}
@keyframes pop {
    0% { transform: scale(0); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
}
.digits-string {
    font-size: 0.85rem; color: #10b981;
    font-family: monospace; padding: 0.6rem 1rem;
    background: #0a0a0f; border-radius: 8px;
    border: 1px solid #10b981;
    display: inline-block;
}
.call-status {
    display: inline-block; padding: 0.35rem 0.9rem;
    border-radius: 20px; font-size: 0.72rem;
    font-weight: 700; text-transform: uppercase;
    background: #2a2a3a; color: #888;
    letter-spacing: 0.05em;
}
.call-status.in-progress {
    background: #1a2e1a; color: #10b981;
    animation: pulse 2s infinite;
}
.call-status.ringing {
    background: #2e2a1a; color: #f5a623;
}
.call-status.completed {
    background: #2a2a3a; color: #666;
}
.empty {
    text-align: center; padding: 4rem 2rem;
    color: #555; font-size: 0.95rem;
    border: 2px dashed #2a2a3a; border-radius: 12px;
}
.empty .big { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }
.waiting {
    color: #555; font-size: 0.85rem;
    font-style: italic;
}
</style>
</head>
<body>

<h1>📞 Dashboard Appels</h1>

<div class="status">
    <div class="dot" id="dot"></div>
    <span id="connStatus">Connexion au serveur…</span>
</div>

<div class="calls" id="calls">
    <div class="empty">
        <div class="big">📱</div>
        <div>Aucun appel pour le moment</div>
        <div style="margin-top:0.5rem;font-size:0.8rem;color:#444;">
            Appelle ton numéro Twilio depuis ton téléphone pour tester
        </div>
    </div>
</div>

<script>
// ⚠️ REMPLACE PAR L'URL DE TON SERVEUR RAILWAY
const API_URL = 'https://TON-APP.railway.app';
const WS_URL = API_URL.replace('https://', 'wss://').replace('http://', 'ws://');

let ws;
const calls = {};

function connect() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
        document.getElementById('dot').classList.add('on');
        document.getElementById('connStatus').textContent = '✓ Connecté — en attente d\'appels';
    };

    ws.onclose = () => {
        document.getElementById('dot').classList.remove('on');
        document.getElementById('connStatus').textContent = 'Déconnecté — reconnexion dans 2s…';
        setTimeout(connect, 2000);
    };

    ws.onerror = (e) => {
        console.error('Erreur WebSocket', e);
    };

    ws.onmessage = (e) => {
        try {
            const msg = JSON.parse(e.data);
            const sid = msg.callSid;

            if (msg.type === 'incoming') {
                calls[sid] = {
                    from: msg.from,
                    digits: [],
                    digitsString: '',
                    startTime: new Date(),
                    status: 'in-progress'
                };
                playBeep();
                renderCalls();
            }
            else if (msg.type === 'digit') {
                if (!calls[sid]) calls[sid] = {
                    from: msg.from, digits: [], digitsString: '',
                    startTime: new Date(), status: 'in-progress'
                };
                calls[sid].digits.push(msg.value);
                calls[sid].digitsString = msg.all;
                playDing();
                renderCalls();
            }
            else if (msg.type === 'status') {
                if (calls[sid]) calls[sid].status = msg.value;
                renderCalls();
            }
            else if (msg.type === 'ended') {
                if (calls[sid]) calls[sid].status = 'completed';
                renderCalls();
            }
        } catch (err) { console.error(err); }
    };
}

function playBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 800;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
}

function playDing() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 1200;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
}

function renderCalls() {
    const container = document.getElementById('calls');
    const keys = Object.keys(calls).sort((a, b) => calls[b].startTime - calls[a].startTime);

    if (keys.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <div class="big">📱</div>
                <div>Aucun appel pour le moment</div>
            </div>`;
        return;
    }

    container.innerHTML = keys.map(sid => {
        const c = calls[sid];
        return `
            <div class="call-card">
                <div class="call-header">
                    <div>
                        <div class="call-from">📱 ${escapeHtml(c.from || 'Inconnu')}</div>
                        <div class="call-time">${c.startTime.toLocaleTimeString('fr-FR')}</div>
                    </div>
                    <span class="call-status ${c.status}">${c.status}</span>
                </div>
                <div class="digits-display">
                    ${c.digits.length === 0
                        ? '<span class="waiting">En attente de saisie…</span>'
                        : c.digits.map(d => `<div class="digit-box">${d}</div>`).join('')}
                </div>
                ${c.digitsString ? `<div class="digits-string">Code complet : ${c.digitsString}</div>` : ''}
            </div>
        `;
    }).join('');
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, ch => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[ch]));
}

connect();
</script>

</body>
</html>
